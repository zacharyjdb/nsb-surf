name: NSBSurf
options:
  bundleIdPrefix: com.zacharybrown
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 7YH52RAULT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NSBSurf:
    type: application
    platform: iOS
    sources:
      - path: NSBSurf
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharybrown.nsbsurf
        INFOPLIST_KEY_CFBundleDisplayName: NSB Surf
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  NSBSurfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NSBSurfTests
    dependencies:
      - target: NSBSurf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharybrown.nsbsurf.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NSBSurf:
    build:
      targets:
        NSBSurf: all
        NSBSurfTests: [test]
    test:
      targets:
        - NSBSurfTests
